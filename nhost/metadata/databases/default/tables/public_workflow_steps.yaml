table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - position
        - type
        - name
        - config
        - created_at
        - updated_at
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      # Layer 2 privileged types also enforced by Postgres trigger
      check:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
      columns:
        - workflow_id
        - position
        - type
        - name
        - config
update_permissions:
  - role: user
    permission:
      columns:
        - position
        - type
        - name
        - config
      filter:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
