table:
  name: db_write_results
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - workflow_run_id
        - step_run_id
        - key
        - payload
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
