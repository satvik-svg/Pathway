actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      # Prefer Vercel engine (Nhost functions often return Unhandled without secrets)
      handler: 'https://pathway-coral.vercel.app/api/functions/trigger-workflow-run'
      forward_client_headers: true
      timeout: 300
    permissions:
      - role: user
    comment: Start a workflow run after org/role + quota checks
  - name: approveStep
    definition:
      kind: synchronous
      handler: 'https://pathway-coral.vercel.app/api/functions/approve-step'
      forward_client_headers: true
      timeout: 300
    permissions:
      - role: user
    comment: Resume a paused approval_gate after role check
  - name: webhookStartRun
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/webhook-trigger'
      forward_client_headers: true
      timeout: 300
    permissions:
      - role: public
      - role: user
    comment: Inbound webhook endpoint to start a run by secret
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
    - name: ApproveStepOutput
    - name: WebhookStartRunOutput
  scalars: []
